[project]
name = "jobscout"
version = "0.1.0"
description = "A daily job-hunting agent: fetch postings, dedupe semantically, score against your profile with an LLM, and deliver a ranked Telegram digest with draft application notes. Human applies; the bot never does."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "langgraph>=0.2",
    "fastembed>=0.3",
    "gspread>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1"
markers = [
    "pg: integration tests that need a running Postgres with pgvector (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
